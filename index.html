<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Empty Bin Search</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    body{
      font-family: "Segoe UI", system-ui, sans-serif;
      margin:0;
      padding:24px;
      background:#eef2ff;
    }

    .card{
      max-width:900px;
      margin:auto;
      background:white;
      padding:18px;
      border-radius:12px;
      box-shadow:0 4px 18px rgba(0,0,0,.07);
    }

    h2{
      text-align:center;
      margin:10px 0 20px;
      color:#2563eb;
    }

    form{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    input{
      padding:11px 12px;
      width:240px;
      border-radius:8px;
      border:1px solid #cbd5e1;
      font-size:16px;
    }

    button{
      padding:11px 16px;
      border-radius:8px;
      border:none;
      background:#2563eb;
      color:white;
      font-size:15px;
      cursor:pointer;
    }

    button.secondary{
      background:#64748b;
    }

    .top-actions{
      text-align:center;
      margin-top:14px;
    }

    .top-actions button{
      margin:5px;
    }

    #qr-reader{
      max-width:300px;
      margin:10px auto;
    }

    #binsGrid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
      gap:10px;
      margin-top:20px;
    }

    .bin-card{
      padding:12px;
      background:#f1f5f9;
      border-radius:8px;
      font-weight:600;
      text-align:center;
      cursor:pointer;
      transition:.18s;
    }

    .bin-card:hover{
      background:#bae6fd;
    }

    .selected{
      background:#ef4444!important;
      color:white;
    }

    .muted{
      text-align:center;
      color:#64748b;
      margin-top:8px
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Empty Bin Finder</h2>

  <!-- SEARCH -->
  <form id="searchForm">
    <input id="id" placeholder="Scan or enter Location ID" autocomplete="off">
    <button type="submit">Search</button>
    <button type="button" id="scanBtn" class="secondary">Scan</button>
  </form>

  <!-- CAMERA -->
  <div id="qr-reader"></div>

  <div class="top-actions">
    <button id="downloadBtn" class="secondary">Download PDF</button>
    <button id="clearAllBtn" class="secondary">Clear All</button>
  </div>

  <div id="message" class="muted"></div>

  <!-- RESULTS -->
  <div id="binsGrid"></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="script.js"></script>
</body>
</html>
